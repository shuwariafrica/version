name: "ci"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JDK_CURRENT: 25
  SBT_OPTS: >- # Use all available resources
    -Xmx10G
    -Xms6G
    -Xss4M
    -XX:ReservedCodeCacheSize=512M

jobs:
  test_jvm:
    name: "jvm / jdk-${{ matrix.java }} / tests"
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 21
            dockerImage: shuwariafrica/el10-jdk:21@sha256:06f9ac141b63cd2205a19437b37ba0ee38d92709eddbbf18e954a2cba53ea8cd
          - java: 25
            dockerImage: shuwariafrica/el10-jdk:25@sha256:e3e1e3d1a486427e4df28b7d0b1671c15256f18125f4229b266339d8e1be9ca4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: ${{ matrix.dockerImage }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Coursier Cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Execute Unit Tests
        run: project/scripts/run-sbt.sh "version-jvm/test"

      - name: Package Project Products
        run: project/scripts/run-sbt.sh "version-jvm/package"

  test_js:
    name: "js / node-${{ matrix.node }} / tests"
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24, 26 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK_CURRENT }}
          check-latest: true

      - name: Setup sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Setup Coursier Cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Execute Unit Tests
        run: project/scripts/run-sbt.sh "version-js/test"

      - name: Package Project Products
        run: project/scripts/run-sbt.sh "version-js/package"

  test_native:
    name: "native / ${{ matrix.target }} / tests"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-musl-x86_64
            runner: ubuntu-24.04
            dockerImage: shuwariafrica/alpine-jdk:25@sha256:5a13a8a028dcd56a387eb22d3a612853ec4786042eff3a926704cc54102a18cd
            archiveTarget: linux-x86_64
            releaseProps: -Dsbt.ci=true -Drelease.binary.static=true
            ship: true
          - target: linux-musl-aarch64
            runner: ubuntu-24.04-arm
            dockerImage: shuwariafrica/alpine-jdk:25@sha256:5a13a8a028dcd56a387eb22d3a612853ec4786042eff3a926704cc54102a18cd
            archiveTarget: linux-aarch64
            releaseProps: -Dsbt.ci=true -Drelease.binary.static=true
            ship: true
          - target: linux-glibc-x86_64
            runner: ubuntu-24.04
            dockerImage: shuwariafrica/el10-jdk:25@sha256:e3e1e3d1a486427e4df28b7d0b1671c15256f18125f4229b266339d8e1be9ca4
            archiveTarget: linux-glibc-x86_64
            ship: false
          - target: linux-glibc-aarch64
            runner: ubuntu-24.04-arm
            dockerImage: shuwariafrica/el10-jdk:25@sha256:e3e1e3d1a486427e4df28b7d0b1671c15256f18125f4229b266339d8e1be9ca4
            archiveTarget: linux-glibc-aarch64
            ship: false
          - target: macos-aarch64
            runner: macos-26
            archiveTarget: macos-aarch64
            releaseProps: -Dsbt.ci=true
            ship: true
          - target: windows-x86_64
            runner: windows-2025-vs2026
            archiveTarget: windows-x86_64
            releaseProps: -Dsbt.ci=true
            ship: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_IMAGE: ${{ matrix.dockerImage }}
      SBT_PROPS: ${{ matrix.releaseProps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: "[host] Setup Java"
        if: matrix.dockerImage == ''
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK_CURRENT }}
          check-latest: true

      - name: "[host] Setup sbt"
        if: matrix.dockerImage == ''
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Setup Coursier Cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Resolve libgit2 SHA
        id: libgit2
        shell: bash
        run: echo "sha=$(git -C vendor/libgit2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache libgit2 Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/libgit2/build
          key: libgit2-v3-${{ matrix.target }}-${{ steps.libgit2.outputs.sha }}-${{ hashFiles('project/Libgit2Build.scala', 'project/cmake-overrides/**') }}

      - name: "[Windows] Setup MSVC"
        # Use vcvarsall.bat
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
                  -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" amd64 && set" |
            ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" } } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "[Windows] Install GnuPG"
        # Install a native Win32 GnuPG and point the harness at
        # it explicitly via VERSION_GPG
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        timeout-minutes: 5
        run: |
          # gnupg.org's Windows build is an NSIS installer that is ALSO a valid
          # 7z archive. Extracting it
          $file   = "gnupg-w32-2.5.24_20260923.exe"
          $sha256 = "ea6f9dee2cccd83287432625b8b399173805add81d27067fcaf019c0c4da1ad8"
          $url    = "https://gnupg.org/ftp/gcrypt/binary/$file"
          $dest   = "C:\gnupg"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\$file"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) { throw "$file SHA-256 is $actual, expected $sha256" }
          7z x "$env:RUNNER_TEMP\$file" "-o$dest" -y | Out-Null
          $gpg = Get-ChildItem $dest -Recurse -Filter gpg.exe | Select-Object -First 1
          if (-not $gpg) { throw "gpg.exe not found after extraction" }
          "VERSION_GPG=$($gpg.FullName)" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
          Split-Path $gpg.FullName       | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & $gpg.FullName --version | Select-Object -First 1

      - name: Execute Unit Tests
        shell: bash
        run: project/scripts/run-sbt.sh "version-native/test"

      - name: Build Release Archive
        id: archive
        shell: bash
        env:
          ACTIONS_PUBLISH_TARGET: ${{ matrix.archiveTarget }}
        run: project/scripts/run-sbt.sh "version-cliNative/releaseArchive"

      - name: "[Linux] Verify Static Linkage"
        if: matrix.ship && contains(matrix.releaseProps, 'release.binary.static=true')
        shell: sh
        run: |
          bin="${{ steps.archive.outputs.binary }}"
          file_out=$(file "$bin")
          echo "$file_out"
          case "$file_out" in
            *"statically linked"*) echo "OK: $bin is statically linked" ;;
            *) echo "::error::$bin is NOT statically linked: $file_out"; exit 1 ;;
          esac

      - name: Execute Binary Test
        shell: bash
        env:
          BIN_PATH: ${{ steps.archive.outputs.binary }}
        run: |
          fixture=$(mktemp -d)
          git -c init.defaultBranch=main init -q "$fixture"
          git -C "$fixture" -c user.email=ci@example.com -c user.name=ci commit -q --allow-empty -m initial
          git -C "$fixture" -c user.email=ci@example.com -c user.name=ci tag -am "v1.2.3" v1.2.3
          unset GITHUB_REF GITHUB_REF_NAME GITHUB_SHA GITHUB_HEAD_REF GITHUB_BASE_REF GITHUB_EVENT_NAME GITHUB_REPOSITORY GITHUB_RUN_ID GITHUB_ACTIONS CI
          out=$("$BIN_PATH" --repository "$fixture" --emit raw)
          echo "Resolved: $out"
          case "$out" in
            *1.2.3*) echo "OK: expected version produced" ;;
            *) echo "::error::expected 1.2.3 in output, got: $out"; exit 1 ;;
          esac

      - name: Upload Binary Artefact
        if: matrix.ship
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.archiveTarget }}
          path: ${{ steps.archive.outputs.archive }}
          # Push builds feed publish_binaries; PR builds feed verify only.
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}
          if-no-files-found: error

  verify_linux_static_portability:
    name: "native / glibc-${{ matrix.arch }} / verify-static-binary"
    needs: test_native
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Download Binary Artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-linux-${{ matrix.arch }}
          path: bin

      - name: Execute Binary
        shell: bash
        run: |
          archive=$(ls bin/*.tar.gz | head -1)
          mkdir -p extracted
          tar -xzf "$archive" -C extracted
          bin_path=$(find extracted -maxdepth 3 -type f -name version | head -1)
          if [[ -z "$bin_path" ]]; then
            echo "::error::no version binary found inside $archive"; exit 1
          fi
          ldd_out=$(ldd "$bin_path" 2>&1 || true)
          echo "$ldd_out"
          case "$ldd_out" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "::error::expected static binary, ldd reports dynamic dependencies"; exit 1 ;;
          esac
          fixture=$(mktemp -d)
          git -c init.defaultBranch=main init -q "$fixture"
          git -C "$fixture" -c user.email=ci@example.com -c user.name=ci commit -q --allow-empty -m initial
          git -C "$fixture" -c user.email=ci@example.com -c user.name=ci tag -am "v1.2.3" v1.2.3
          unset GITHUB_REF GITHUB_REF_NAME GITHUB_SHA GITHUB_HEAD_REF GITHUB_BASE_REF GITHUB_EVENT_NAME GITHUB_REPOSITORY GITHUB_RUN_ID GITHUB_ACTIONS CI
          out=$("$bin_path" --repository "$fixture" --emit raw)
          echo "Resolved on glibc: $out"
          case "$out" in
            *1.2.3*) echo "OK: static-musl binary works on glibc" ;;
            *) echo "::error::expected 1.2.3 in output, got: $out"; exit 1 ;;
          esac

  test_sbt_scripted:
    name: "jvm / sbt-plugin / scripted-tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: shuwariafrica/el10-jdk:25@sha256:e3e1e3d1a486427e4df28b7d0b1671c15256f18125f4229b266339d8e1be9ca4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Coursier Cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Execute sbt Scripted Tests
        # Scripted tests run the plugin against synthetic fixtures; the workflow's CI env must not leak in.
        run: |
          unset GITHUB_REF GITHUB_REF_NAME GITHUB_SHA GITHUB_HEAD_REF GITHUB_BASE_REF GITHUB_EVENT_NAME GITHUB_REPOSITORY GITHUB_RUN_ID GITHUB_ACTIONS CI
          project/scripts/run-sbt.sh "sbt-version/scripted"

  static_analysis:
    name: 'report / analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_IMAGE: shuwariafrica/el10-jdk:25@sha256:e3e1e3d1a486427e4df28b7d0b1671c15256f18125f4229b266339d8e1be9ca4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Coursier Cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Verify Source Formatting
        id: scalafmt
        continue-on-error: true
        run: project/scripts/run-sbt.sh scalafmtCheckAll scalafmtSbtCheck

      - name: Verify Linting Conformity
        id: scalafix
        continue-on-error: true
        run: project/scripts/run-sbt.sh "scalafixAll --check"

      - name: Verify File Header Conformity
        id: headers
        continue-on-error: true
        run: project/scripts/run-sbt.sh headerCheckAll

      - name: Check for Failures
        if: always()
        run: |
          failed=""
          [[ "${{ steps.scalafmt.outcome }}" == "failure" ]] && failed="$failed scalafmtCheckAll"
          [[ "${{ steps.scalafix.outcome }}" == "failure" ]] && failed="$failed scalafixAll"
          [[ "${{ steps.headers.outcome }}" == "failure" ]] && failed="$failed headerCheckAll"
          if [[ -n "$failed" ]]; then
            echo "::error::Static analysis checks failed:$failed"
            exit 1
          fi

  docs:
    name: 'site / assemble'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: shuwariafrica/el10-jdk:21@sha256:06f9ac141b63cd2205a19437b37ba0ee38d92709eddbbf18e954a2cba53ea8cd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Coursier Cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Build Documentation Site
        id: build-site
        run: project/scripts/run-sbt.sh -Dsbt.ci=true docs/generateUnidoc

      - name: Verify Documentation Built
        run: |
          site_dir="${{ steps.build-site.outputs.site_dir }}"
          test -s "$site_dir/index.html" \
            || { echo "::error::Documentation site build produced no index.html"; exit 1; }
          touch "$site_dir/.nojekyll"

      - name: Upload Pages Artefact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.build-site.outputs.site_dir }}

      - name: Upload Rendered README
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme
          path: ${{ steps.build-site.outputs.readme_path }}
          retention-days: 90
          if-no-files-found: error

  dependency-graph:
    name: 'report / dependency-graph'
    # scalacenter/sbt-dependency-submission manages its own sbt invocation,
    # so this job intentionally does not use run-sbt.sh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK_CURRENT }}
          check-latest: true

      - name: Setup sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Setup Coursier Cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Submit Dependency Graph
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3

  dispatch_release:
    name: 'release / dispatch'
    # On tag-push only, after every quality gate passes, hand off to release.yml
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test_jvm
      - test_js
      - test_native
      - verify_linux_static_portability
      - test_sbt_scripted
      - static_analysis
      - docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f ci_run_id="${{ github.run_id }}"
