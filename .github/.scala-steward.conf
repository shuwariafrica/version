# sbt 2.0.x compiles build definitions with Scala 3.8, so the sbt plugin's closure (the libraries, boilerplate and
# scala3-library) must stay readable by it. The CLI's own Scala line in project/Libraries.scala is moved by hand.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.8." },
  { groupId = "africa.shuwari", artifactId = "boilerplate", version = "0.13." },
  { groupId = "africa.shuwari", artifactId = "boilerplate-effect", version = "0.13." }
]
